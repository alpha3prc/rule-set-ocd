name: Auto Convert Ruleset

on:
  push:
    paths:
      - '**.yaml'  # 监听所有 yaml 文件的变动
      - '**.yml'
    branches:
      - main       # 或者是 master，根据你的主分支名称修改
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Latest Mihomo
        run: |
          echo "🔍 Fetching latest Mihomo release URL..."
          
          # 使用 GitHub API 获取 Latest Release 的下载链接
          # 筛选逻辑：linux-amd64 架构，排除 compatible 版本（也就是 v3 指令集版本，通常用标准版即可），必须是 .gz 结尾
          DOWNLOAD_URL=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | grep "browser_download_url" \
            | grep "linux-amd64-" \
            | grep -v "compatible" \
            | grep ".gz" \
            | head -n 1 \
            | cut -d '"' -f 4)
          
          echo "⬇️ Downloading from: $DOWNLOAD_URL"
          
          wget -q "$DOWNLOAD_URL" -O mihomo.gz
          gzip -d mihomo.gz
          chmod +x mihomo
          
          echo "✅ Mihomo version:"
          ./mihomo -v

      - name: Convert Rulesets
        run: |
          # 遍历当前目录下所有的 .yaml 文件
          # ⚠️ 注意：你需要根据自己的文件结构调整路径，例如 rules/*.yaml
          
          for file in *.yaml; do
            # 跳过 workflow 自身配置或非规则文件
            [[ "$file" == "docker-compose.yaml" ]] && continue
            
            filename=$(basename "$file" .yaml)
            echo "--------------------------------"
            echo "Processing: $file"

            # === 自动判断规则类型 (核心逻辑) ===
            # mihomo convert-ruleset 需要指定 behavior: 'domain' 或 'ipcidr'
            # 这里使用简单的文件名匹配逻辑：
            # 如果文件名包含 "ip" (如 ipcidr.yaml, cn-ip.yaml)，则使用 ipcidr
            # 否则默认为 domain
            
            if [[ "$filename" == *"ip"* ]]; then
              behavior="ipcidr"
            else
              behavior="domain"
            fi
            
            echo "Type detected: $behavior"

            # 执行转换命令
            ./mihomo convert-ruleset $behavior "$file" "${filename}.mrs"

            if [ $? -eq 0 ]; then
              echo "✅ Success: ${filename}.mrs created."
            else
              echo "❌ Error: Failed to convert $file"
              exit 1
            fi
          done

      - name: Delete Mihomo Binary
        run: rm mihomo

      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update .mrs rulesets (via mihomo latest) [skip ci]"
          file_pattern: "*.mrs"