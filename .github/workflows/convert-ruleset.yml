name: Auto Build MRS and SRS Files

on:
  push:
    paths:
      - '**.yaml'
      - '**.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ==========================================
      # 步骤 1: 使用 Mihomo 转换 YAML 到 MRS
      # ==========================================
      - name: Install and Run Mihomo (YAML -> MRS)
        run: |
          echo "🔍 Fetching latest Mihomo release tag..."
          LATEST_TAG=$(curl -sL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r ".tag_name")
          
          echo "⬇️  Downloading Mihomo $LATEST_TAG..."
          DOWNLOAD_URL="https://github.com/MetaCubeX/mihomo/releases/download/$LATEST_TAG/mihomo-linux-amd64-$LATEST_TAG.gz"
          
          wget -q "$DOWNLOAD_URL" -O mihomo.gz
          gzip -d mihomo.gz
          chmod +x mihomo
          
          echo "✅ Mihomo version:"
          ./mihomo -v

          echo "🚀 Starting YAML to MRS conversion..."
          
          shopt -s nullglob
          
          # 查找所有 yaml 文件（包含子目录）
          find . -type f -name "*.yaml" -not -path "./.github/*" | while read -r file; do
            filename=$(basename "$file" .yaml)
            dirname=$(dirname "$file")
            
            # 简单的类型判断
            if [[ "$filename" == *"ip"* ]] || [[ "$filename" == *"cidr"* ]]; then
              TYPE="ipcidr"
            else
              TYPE="domain"
            fi
            
            echo "Processing: $file -> $dirname/${filename}.mrs (Type: $TYPE)"
            
            ./mihomo convert-ruleset "$TYPE" yaml "$file" "$dirname/${filename}.mrs"
            
            if [ $? -eq 0 ]; then
              echo "✅ Created $dirname/${filename}.mrs"
            else
              echo "❌ Error converting $file"
              exit 1
            fi
          done

          rm mihomo

      # ==========================================
      # 步骤 2: 使用 sing-box 转换 JSON 到 SRS
      # ==========================================
      - name: Install and Run sing-box (JSON -> SRS)
        run: |
          echo "🔍 Fetching latest sing-box release tag..."
          # 获取最新的 tag (例如 v1.9.0)
          SINGBOX_TAG=$(curl -sL https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r ".tag_name")
          # 移除首字母 v，得到 1.9.0
          SINGBOX_VERSION=${SINGBOX_TAG#v} 
          
          echo "⬇️  Downloading sing-box $SINGBOX_TAG..."
          DOWNLOAD_URL="https://github.com/SagerNet/sing-box/releases/download/$SINGBOX_TAG/sing-box-$SINGBOX_VERSION-linux-amd64.tar.gz"
          
          wget -q "$DOWNLOAD_URL" -O sing-box.tar.gz
          tar -xzf sing-box.tar.gz
          mv sing-box-$SINGBOX_VERSION-linux-amd64/sing-box ./sing-box
          chmod +x sing-box
          
          echo "✅ sing-box version:"
          ./sing-box version
          
          echo "🚀 Starting JSON to SRS conversion..."
          
          shopt -s nullglob
          
          # 查找所有 json 文件（包含子目录）进行转换
          find . -type f -name "*.json" -not -path "./.github/*" | while read -r file; do
            filename=$(basename "$file" .json)
            dirname=$(dirname "$file")
            
            echo "Processing: $file -> $dirname/${filename}.srs"
            
            ./sing-box rule-set compile "$file" -o "$dirname/${filename}.srs"
            
            if [ $? -eq 0 ]; then
              echo "✅ Created $dirname/${filename}.srs"
            else
              echo "❌ Error converting $file"
              exit 1
            fi
          done
          
          # 清理工作目录
          rm -rf sing-box sing-box.tar.gz sing-box-$SINGBOX_VERSION-linux-amd64

      # ==========================================
      # 步骤 3: 自动提交生成的 MRS 和 SRS 文件
      # ==========================================
      - name: Commit and Push MRS/SRS Files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto update mrs and srs rulesets [skip ci]"
          file_pattern: "**/*.mrs **/*.srs"
