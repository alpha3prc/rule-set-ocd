name: Convert Ruleset to MRS

# 触发条件：当 rules 目录下的 yaml 文件发生 push 时触发
# 如果你的文件在根目录，请修改 paths 为 '**.yaml'
on:
  push:
    paths:
      - '**.yaml'
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Mihomo (Clash Meta)
        run: |
          # 下载最新版 Mihomo (Clash Meta) 内核
          # 这里的 URL使用了 alpha 版本以确保功能最新，你也可以固定特定 Release 版本
          wget https://github.com/MetaCubeX/mihomo/releases/download/v1.17.0/mihomo-linux-amd64-v1.17.0.gz -O mihomo.gz
          gzip -d mihomo.gz
          chmod +x mihomo
          ./mihomo -v

      - name: Convert YAML to MRS
        run: |
          # 创建存放 mrs 的目录（可选，如果想放在原处可跳过）
          # mkdir -p output 
          
          # 遍历所有的 yaml 文件
          # 注意：你需要根据文件名判断规则类型 (domain/ipcidr)，或者统一处理
          
          for file in *.yaml; do
            # 排除非规则文件（如 github workflow 自身配置等，如果都在根目录）
            [[ "$file" == "docker-compose.yaml" ]] && continue
            
            filename=$(basename "$file" .yaml)
            echo "Processing $file..."

            # --- 策略部分：判断规则类型 ---
            # 简单的判断逻辑：如果文件名包含 'ip' 则认为是 ipcidr，否则默认为 domain
            # 你可以根据实际情况修改这个逻辑
            if [[ "$filename" == *"ip"* ]]; then
              behavior="ipcidr"
            else
              behavior="domain"
            fi
            
            # 执行转换命令: mihomo convert-ruleset <behavior> <input> <output>
            ./mihomo convert-ruleset $behavior "$file" "${filename}.mrs"
            
            if [ $? -eq 0 ]; then
              echo "✅ Generated ${filename}.mrs (Type: $behavior)"
            else
              echo "❌ Failed to convert $file"
              exit 1
            fi
          done

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto generate .mrs files [skip ci]"
          file_pattern: "*.mrs"