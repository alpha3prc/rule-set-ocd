name: Auto Build MRS Files

on:
  push:
    paths:
      - '**.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install and Run Mihomo
        run: |
          echo "🔍 Fetching latest Mihomo release tag..."
          LATEST_TAG=$(curl -sL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r ".tag_name")
          
          echo "⬇️  Downloading Mihomo $LATEST_TAG..."
          DOWNLOAD_URL="https://github.com/MetaCubeX/mihomo/releases/download/$LATEST_TAG/mihomo-linux-amd64-$LATEST_TAG.gz"
          
          wget -q "$DOWNLOAD_URL" -O mihomo.gz
          gzip -d mihomo.gz
          chmod +x mihomo
          
          echo "✅ Mihomo version:"
          ./mihomo -v

          echo "🚀 Starting conversion..."
          
          # 开启 nullglob，防止没有 yaml 文件时遍历出 "*.yaml" 字符串
          shopt -s nullglob
          
          # 查找所有 yaml 文件（包含子目录）
          # 使用 find 命令更安全，避免目录层级问题
          find . -type f -name "*.yaml" -not -path "./.github/*" | while read -r file; do
            filename=$(basename "$file" .yaml)
            dirname=$(dirname "$file")
            
            # 简单的类型判断
            if [[ "$filename" == *"ip"* ]] || [[ "$filename" == *"cidr"* ]]; then
              TYPE="ipcidr"
            else
              TYPE="domain"
            fi
            
            echo "Processing: $file -> $dirname/${filename}.mrs (Type: $TYPE)"
            
            # --- 核心修复 ---
            # 新版语法: ./mihomo convert-ruleset <behavior> <format> <input> <output>
            # 增加了 'yaml' 参数
            ./mihomo convert-ruleset "$TYPE" yaml "$file" "$dirname/${filename}.mrs"
            
            if [ $? -eq 0 ]; then
              echo "✅ Created $dirname/${filename}.mrs"
            else
              echo "❌ Error converting $file"
              exit 1
            fi
          done

          rm mihomo

      - name: Commit and Push MRS Files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update mrs files [skip ci]"
          file_pattern: "**/*.mrs"